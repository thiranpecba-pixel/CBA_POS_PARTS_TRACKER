<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CBA — Item Request Form</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Same Firebase project as the CBA Terminal Tracker
  const firebaseConfig = {
    apiKey: "AIzaSyD9baMvEDGOHo3n-6QiWlEFoGNhtkfP9Co",
    authDomain: "cba-pos-leave-sheet.firebaseapp.com",
    projectId: "cba-pos-leave-sheet",
    storageBucket: "cba-pos-leave-sheet.firebasestorage.app",
    messagingSenderId: "100028126145",
    appId: "1:100028126145:web:27789831f86c17ffb05540",
  };

  const app = initializeApp(firebaseConfig);
  const firestore = getFirestore(app);
  const AGENT_REQ_COL = collection(firestore, "agent_requests");

  window._submitAgentRequest = async function(payload) {
    payload.submittedAt = new Date().toISOString();
    await addDoc(AGENT_REQ_COL, payload);
  };

  window._fbFormReady = true;
</script>
<style>
  :root{
    --bg:#0a0d12; --surface:#111620; --surface2:#161c28; --border:#1e2840; --border2:#253050;
    --text:#e2e8f0; --text-dim:#64748b; --text-muted:#94a3b8;
    --accent:#00d4aa; --accent2:#3b7ff5; --danger:#ef4444; --success:#10b981;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Sora',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px 60px;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size:40px 40px; pointer-events:none;
  }
  .wrap{ position:relative; z-index:1; width:100%; max-width:560px; }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .brand-icon{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 4px 16px rgba(0,212,170,0.25);
  }
  .brand-text h1{ font-size:17px; font-weight:700; letter-spacing:-0.3px; }
  .brand-text span{ font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px; box-shadow:0 8px 40px rgba(0,0,0,0.4);
  }
  .card-title{ font-size:19px; font-weight:700; margin-bottom:6px; }
  .card-sub{ font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:22px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; }
  .form-group{ display:flex; flex-direction:column; gap:6px; }
  .form-group.full{ grid-column:1 / -1; }
  .form-label{ font-size:11.5px; font-weight:600; color:var(--text-muted); }
  .form-label .req{ color:var(--danger); }
  .form-input, .form-textarea{
    background:var(--surface2); border:1px solid var(--border2); border-radius:10px;
    padding:11px 13px; font-family:'Sora',sans-serif; font-size:13.5px; color:var(--text);
    outline:none; transition:border-color .15s, background .15s; width:100%;
  }
  .form-textarea{ resize:vertical; min-height:64px; font-family:'Sora',sans-serif; }
  .form-input:focus, .form-textarea:focus{ border-color:var(--accent2); background:#131a28; }
  .form-input.input-error{ border-color:var(--danger); }

  .submit-btn{
    margin-top:22px; width:100%; padding:14px; border:none; border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04110d;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s, box-shadow .12s; box-shadow:0 4px 16px rgba(0,212,170,0.2);
  }
  .submit-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 22px rgba(0,212,170,0.3); }
  .submit-btn:active{ transform:translateY(0); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .foot-note{ margin-top:16px; font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.5; }

  /* Success state */
  .success-view{ display:none; text-align:center; padding:20px 4px 4px; }
  .success-view.show{ display:block; }
  .success-icon{
    width:58px; height:58px; border-radius:50%; margin:0 auto 16px;
    background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3);
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .success-title{ font-size:17px; font-weight:700; margin-bottom:6px; }
  .success-sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:18px; line-height:1.5; }
  .receipt{
    text-align:left; background:var(--surface2); border:1px solid var(--border2);
    border-radius:12px; padding:14px 16px; font-family:'DM Mono',monospace; font-size:11.5px;
    color:var(--text-muted); margin-bottom:18px;
  }
  .receipt div{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .receipt div span:first-child{ color:var(--text-dim); }
  .receipt div span:last-child{ color:var(--text); text-align:right; }
  .again-btn{
    padding:10px 20px; border-radius:10px; border:1px solid var(--border2);
    background:transparent; color:var(--text); font-family:'Sora',sans-serif;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .again-btn:hover{ border-color:var(--accent2); color:var(--accent2); }

  .form-view{ display:block; }
  .form-view.hide{ display:none; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface2); border:1px solid var(--border2); border-radius:10px;
    padding:11px 18px; font-size:12.5px; color:var(--text); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.is-error{ border-color:rgba(239,68,68,0.4); color:#fca5a5; }

  @media (max-width:520px){
    .form-grid{ grid-template-columns:1fr; }
    .card{ padding:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">🏦</div>
    <div class="brand-text">
      <h1>CBA Item Request</h1>
    </div>
  </div>

  <div class="card">
    <!-- FORM VIEW -->
    <div class="form-view" id="form-view">
      <div class="card-title">Request an Item</div>

      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Bank Name <span class="req">*</span></label>
          <input class="form-input" type="text" id="f-bank" placeholder="e.g. Commercial Bank">
        </div>
        <div class="form-group full">
          <label class="form-label">Your Name (Requested By)</label>
          <input class="form-input" type="text" id="f-agent" placeholder="e.g. Nimal Perera">
        </div>
        <div class="form-group">
          <label class="form-label">TID Number <span class="req">*</span></label>
          <input class="form-input" type="text" id="f-tid" placeholder="TID number">
        </div>
        <div class="form-group">
          <label class="form-label">Serial Number</label>
          <input class="form-input" type="text" id="f-serial" placeholder="Serial number">
        </div>
        <div class="form-group full">
          <label class="form-label">Merchant Name <span class="req">*</span></label>
          <input class="form-input" type="text" id="f-merchant" placeholder="e.g. ABC Store">
        </div>
        <div class="form-group full">
          <label class="form-label">Merchant Address</label>
          <input class="form-input" type="text" id="f-address" placeholder="Merchant's address">
        </div>
        <div class="form-group full">
          <label class="form-label">Item Type <span class="req">*</span></label>
          <input class="form-input" type="text" id="f-itemtype" placeholder="e.g. Power Adapter, Paper Roll, POS Terminal">
        </div>
        <div class="form-group full">
          <label class="form-label">Notes (optional)</label>
          <textarea class="form-textarea" id="f-notes" placeholder="Anything else CBA staff should know"></textarea>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="submitRequest()">Submit Request</button>
      <div class="foot-note">Your request goes straight into CBA's internal tracker.<br>Fields marked with <span style="color:var(--danger)">*</span> are required.</div>
    </div>

    <!-- SUCCESS VIEW -->
    <div class="success-view" id="success-view">
      <div class="success-icon">✅</div>
      <div class="success-title">Request submitted</div>
      <div class="success-sub">CBA staff have received your request and will hand over the item shortly.</div>
      <div class="receipt" id="receipt"></div>
      <button class="again-btn" onclick="resetForm()">＋ Submit another request</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span></div>

<script>
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show' + (isError ? ' is-error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function clearErrors() {
  ['f-bank','f-tid','f-merchant','f-itemtype'].forEach(id => document.getElementById(id).classList.remove('input-error'));
}

async function submitRequest() {
  clearErrors();
  const g = id => document.getElementById(id).value.trim();
  const bank     = g('f-bank');
  const agent    = g('f-agent');
  const tid      = g('f-tid');
  const serial   = g('f-serial');
  const merchant = g('f-merchant');
  const address  = g('f-address');
  const itemType = g('f-itemtype');
  const notes    = g('f-notes');

  let missing = [];
  if (!bank)     { missing.push('f-bank'); }
  if (!tid)      { missing.push('f-tid'); }
  if (!merchant) { missing.push('f-merchant'); }
  if (!itemType) { missing.push('f-itemtype'); }

  if (missing.length) {
    missing.forEach(id => document.getElementById(id).classList.add('input-error'));
    showToast('Please fill in Bank Name, TID Number, Merchant Name & Item Type', true);
    return;
  }

  if (!window._submitAgentRequest) {
    showToast('Still connecting — please try again in a moment', true);
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    await window._submitAgentRequest({ bank, agent, tid, serial, merchant, address, itemType, notes });

    document.getElementById('receipt').innerHTML = `
      <div><span>Bank</span><span>${esc(bank)}</span></div>
      <div><span>TID Number</span><span>${esc(tid)}</span></div>
      <div><span>Merchant</span><span>${esc(merchant)}</span></div>
      <div><span>Item Type</span><span>${esc(itemType)}</span></div>
      <div><span>Submitted</span><span>${new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
    `;
    document.getElementById('form-view').classList.add('hide');
    document.getElementById('success-view').classList.add('show');
  } catch (e) {
    console.error(e);
    showToast('Could not submit — check your connection and try again', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Request';
  }
}

function resetForm() {
  ['f-bank','f-agent','f-tid','f-serial','f-merchant','f-address','f-itemtype','f-notes'].forEach(id => document.getElementById(id).value = '');
  clearErrors();
  document.getElementById('success-view').classList.remove('show');
  document.getElementById('form-view').classList.remove('hide');
  document.getElementById('f-bank').focus();
}
</script>
</body>
</html>
